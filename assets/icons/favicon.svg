<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121927"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#57D5F2"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#8B7CFF" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Code bracket accent -->
  <path d="M18 24 L12 32 L18 40" fill="none" stroke="#57D5F2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 24 L52 32 L46 40" fill="none" stroke="#57D5F2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monogram BN -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-0.5">BN</text>
</svg>
